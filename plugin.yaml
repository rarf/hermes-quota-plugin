name: quota
version: 3.0.1
description: "Per-provider quota / rate-limit status via /quota command and desktop widget. Reads precomputed quota_cache.json so the widget never does network I/O. Cherry-pick providers in Settings. Nous Portal works on free accounts; Gemini detects tier via loadCodeAssist; Grok uses the REST rate-limits endpoint. Antigravity requires antigravityEnabled=true (default off) and Antigravity CLI 1.1.11+; it queries quota only through `agy -p /usage --output-format json`, leaving login and credentials to agy, and shows the separate Gemini 4 Argon bucket only when the CLI returns it. Pane detail: clean or dense."
author: rarf
kind: standalone
provides_commands:
  - quota
provides_tools: []
