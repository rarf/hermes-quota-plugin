name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  python-tests:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile all backend sources
        run: python -m py_compile __init__.py commands.py quota_cache.py quota_providers/*.py

      - name: Run offline unit tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
        env:
          PYTHONPATH: ${{ github.workspace }}

  widget-js:
    name: Desktop widget syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: node --check every JS file
        # desktop/*.js alone missed scripts/render-widget.cjs and
        # tests/widget_renderer.cjs, so neither harness was ever syntax-checked.
        run: |
          for f in desktop/*.js desktop/*.cjs scripts/*.cjs tests/*.cjs; do
            [ -e "$f" ] || continue
            node --check "$f"
            echo "OK $f"
          done

      - name: Biome lint (format gate intentionally off)
        run: npx --yes @biomejs/biome lint desktop/

  shell-scripts:
    name: Shell tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax and isolated install/uninstall regressions
        env:
          # runner.temp is a trusted runner-provided path, not event input.
          HERMES_TEST_SCRATCH: ${{ runner.temp }}/quota-shell-tests
        run: |
          mkdir -p "$HERMES_TEST_SCRATCH"
          bash -n install.sh uninstall.sh scripts/hermes-config.sh scripts/hermes-home.sh tests/test_install_shell.sh tests/probe_symlink_forms.sh
          bash tests/test_install_shell.sh
          bash tests/probe_symlink_forms.sh

  manifest:
    name: plugin.yaml sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version is valid semver and matches nothing stale
        run: |
          python - <<'PY'
          import re, sys, pathlib
          text = pathlib.Path("plugin.yaml").read_text(encoding="utf-8")
          match = re.search(r'^version:\s*(\S+)', text, re.MULTILINE)
          if not match:
              sys.exit("plugin.yaml: missing version key")
          version = match.group(1)
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              sys.exit(f"plugin.yaml: version '{version}' is not semver X.Y.Z")
          print(f"plugin.yaml version {version} OK")
          PY

  plugin-scanner:
    name: Plugin scanner (Hermes install-time gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # hermes-agent requires 3.11+ to run the scanner. The plugin itself
          # still supports 3.9 -- that is what the matrix above covers.
          python-version: "3.12"

      - name: Run the Hermes plugin scanner against this tree
        run: python scripts/scan_plugin.py --json scanner-report.json

      - name: Keep the findings even when the scan fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-scanner-report
          path: scanner-report.json
          if-no-files-found: ignore
