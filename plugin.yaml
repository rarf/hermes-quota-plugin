name: quota
version: 3.1.0
description: "Per-provider quota / rate-limit status via /quota command and desktop widget. Provider rows are painted from the precomputed quota_cache.json. The CLI/TUI Nous row uses Hermes's private `hermes_cli.nous_account` helper (a disclosed catalog rule 9 coupling; the helper owns credentials and the plugin reads no token). On Desktop the Nous card reads its billing/usage summary through the Desktop SDK's `host.request` to the app's read-only, profile-scoped `billing.state` gateway method on the configured interval (the gateway, not the renderer, may query Nous Portal); that method is not a documented plugin API or compatibility contract, and an unsupported gateway falls back to the cached CLI row. Billing owns plan, windows and, on credit-grant plans, money; a usage-window plan's unavailable dollar-credit model still has Billing's own `balance_display` wallet as one Account balance even when `usage.available` is false. A fresh same-profile account snapshot may add only facts whose exact plan label and access state match Billing's and whose Portal-organisation digest matches Billing's `org_slug`: the cached total-usable figure (outranking Billing's wallet when matched), neutral `Cycle ends` and Spend lines, a live rate-limit line, and the Free tool pool when `tool_access.enabled` is true. `Cycle ends` is used because Billing carries no cancellation state; a cancelled-at-period-end plan must not say Renews. Missing, stale or mismatched facts fail closed, and component subscription/top-up amounts are folded into one balance, never separate lines. An exhausted all-scope gauge with `keep_going_on_credits=false` reports calls unavailable; a paused plan is a warning and its windows are hidden. Cherry-pick providers in Settings. Nous Portal works on free accounts; Gemini detects tier via loadCodeAssist; Grok uses the REST rate-limits endpoint. Antigravity requires antigravityEnabled=true (default off), reads Windows Credential Manager, macOS Keychain, or the Linux agy token file, refreshes with Antigravity's installed-app OAuth client identity, and sends User-Agent antigravity/2.8.0 windows/amd64. Pane detail: clean or dense."
author: rarf
kind: standalone
provides_commands:
  - quota
provides_tools: []
